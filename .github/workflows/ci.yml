name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  # Write access is used only to commit a freshly generated package-lock.json
  # when the repository does not have one yet.
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        id: install
        run: |
          if [ -f package-lock.json ]; then
            if npm ci; then
              LOCK=existing
            else
              # package.json gained a dependency the lockfile does not have yet.
              echo "npm ci failed; updating the lockfile with npm install."
              LOCK=updated
              npm install
            fi
          else
            LOCK=generated
            echo "No lockfile yet: running npm install to create one."
            npm install
          fi
          echo "lockfile=$LOCK" >> "$GITHUB_OUTPUT"
          echo "::notice title=Install (lockfile $LOCK)::node $(node -v), npm $(npm -v); $(npm ls --depth=0 --omit=optional 2>/dev/null | tail -n +2 | sed 's/^[├└─│ ]*//' | tr '\n' ' ')"

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint -- --max-warnings=0

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx vitest run --reporter=default --reporter=json --outputFile=vitest-results.json

      - name: Report test results
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node -e '
            const r = require("./vitest-results.json");
            const files = r.testResults.map(f => {
              const name = f.name.split("/tests/")[1];
              const passed = f.assertionResults.filter(a => a.status === "passed").length;
              return `${name} ${passed}/${f.assertionResults.length}`;
            });
            console.log(`::notice title=Vitest::${r.numPassedTests} passed, ${r.numFailedTests} failed, ${r.numPendingTests} skipped, ${r.numTotalTests} total in ${r.testResults.length} files. ` + files.join("; "));
          '

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npx vite build
          echo "::notice title=Build::$(cd dist && find . -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' \) -exec du -k {} + | sort -k2 | awk '{printf "%s %s kB; ", $2, $1}')"

      - name: Deployment check (Cloudflare Pages rules, headers, robots, secrets, size budget)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/check-dist.mjs | tee dist-check.txt
          echo "::notice title=Deployment check::$(tr '\n' ' ' < dist-check.txt)"

      - name: Install Playwright browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (real Vite build, desktop and mobile)
        id: e2e
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx playwright test

      - name: Report end-to-end results
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node .github/scripts/report-playwright.cjs playwright-results.json Playwright

      # The same deployment spec against Cloudflare's own local emulator of Pages
      # (wrangler pages dev): SPA routing, _headers and robots.txt as Pages serves them.
      # Runs locally on the runner; no Cloudflare account, token or deployment.
      - name: Deployment tests on the Cloudflare Pages emulator
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          WRANGLER_SEND_METRICS: 'false'
          E2E_BASE_URL: http://localhost:8788
          E2E_CLOUDFLARE: '1'
          PW_RESULTS: playwright-cloudflare.json
        run: |
          npx --yes wrangler@4.151.1 pages dev dist --port 8788 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8788/ > /dev/null && break; sleep 1; done
          curl -sI http://localhost:8788/campaigns/fall-of-rome/ending | tr -d '\r' | sed 's/^/  /'
          npx playwright test deployment
        timeout-minutes: 8

      - name: Report emulator results
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node .github/scripts/report-playwright.cjs playwright-cloudflare.json "Cloudflare emulator"
          echo "::notice title=Wrangler::$(npx --yes wrangler@4.151.1 --version 2>/dev/null | tail -1)"
          tail -n 20 wrangler.log || true

      - name: Commit generated or updated lockfile
        if: ${{ success() && (steps.install.outputs.lockfile == 'generated' || steps.install.outputs.lockfile == 'updated') && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update package-lock.json from CI (npm install on Node 22)"
          git push

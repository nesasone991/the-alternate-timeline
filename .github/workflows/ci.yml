name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        id: install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No lockfile yet: running npm install to create one."
            npm install
          fi

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx vite build

      - name: Upload lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: ignore
